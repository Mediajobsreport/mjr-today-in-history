name: Update MJR lottery results

on:
  schedule:
    # NY Open Data typically posts results the morning after each drawing.
    - cron: "17 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lottery-results-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest official draw results
        run: python scripts/update_lottery_results.py

      - name: Commit changed results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lottery-results.json
          if git diff --cached --quiet; then
            echo "No new lottery results to commit."
            exit 0
          fi
          git commit -m "Refresh lottery results"
          git push
